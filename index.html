<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap Forms and Navbar</title>
    <style>
        body {background-image: url(https://www.meralco.com.ph/uploads/images/business-stories/v2/business-story-b710fdecdc1da13ec939.png?v=1788411681);
            background-size: cover;
            background-position: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA" style="height: 70px; width: 70px;" class="rounded"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Homepage</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Enroll Now</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>    
      </ul>
    </div>
    <form class="d-flex ms-auto" role="search">
        <input type="search" class="form-control me-2" placeholder="Search"> 
        <button type="submit" class="btn btn-outline-light">Search</button>
    </form>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <h1 class=".text-black text-center"><p class="text-info">OBMC Student Enrollment</p></h1>
    </div>
</div>
 
<div class="container mt-5">
    <div class="row justify-content-center">
    <div class="col-md-8">
    <form class="text-center bg-white rounded p-5">
        <h4 class="bg-white text-center rounded">Student Information</h4>
        <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="firstName" class="form-control" placeholder="Enter first name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" name="lastName" class="form-control"placeholder="Enter last name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" placeholder="Last Name">
        </div>
        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select class="form-control" placeholder="Gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Grade Level</label>
            <select class="form-control" placeholder="Gender">
                <option>Junior Casa</option>
                <option>Junior Advanced Casa</option>
                <option>Advanced Casa</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
                <input type="Email" class="form-control" placeholder="Name@email.com"> 
        </div>
        <div class="mb-3">
            <label class="form-label">Mother's Name</label>
                <input type="text" class="form-control" placeholder="Name"> 
        </div>
        <div class="mb-3">
            <label class="form-label">Father's Name</label>
                <input type="text" class="form-control" placeholder="Name"> 
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
                <input type="text" class="form-control" placeholder="0123456789"> 
        </div>
 
        <div class="mb-3">
            <label class="form-label">Message</label>
                <input type="text" class="form-control" placeholder="Type here......" style="height: 140px;"> 
        </div>
        <input type="submit" class="btn btn-primary">
    </form>
    </div>
    </div>
    </div>
</div>
</body>
</html>
